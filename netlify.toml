# netlify.toml: Netlify settings for Cardio Explorer.
# Deploys come from GitHub Actions (.github/workflows/ci-cd.yml) with `netlify deploy
# --no-build`, so [build] is used for local `netlify dev` / manual builds and documents
# where things live. Do not connect the GitHub repo in the Netlify dashboard as well.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# Local development: `npx netlify dev` runs Vite and the functions together.
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Single-page app: let React Router handle every page URL (e.g. /modules/glossary on a
# refresh). Real files in dist/ and functions with a `config.path` (/api/health) are
# served before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and privacy headers for every response.
# The CSP allows only this site's own scripts, styles, images and API: no third-party
# scripts, trackers or fonts (matches the privacy plan: we collect nothing).
# style-src-attr 'unsafe-inline' is needed for React `style={...}` attributes
# (e.g. the heart animation speed); it does not allow inline <style> or <script>.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# Vite gives built assets content hashes, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
